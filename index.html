<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마음약국 처방전</title>
<meta property="og:title" content="마음약국 처방전">
<meta property="og:description" content="다다다 페스티벌 마음약국에서 받은 나만의 마음 처방전">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&family=Nanum+Pen+Script&display=swap">
<style>
:root{--bg:#FFF4EA;--card:#FFFFFF;--ink:#3B2A22;--muted:#86695B;--line:#F1DCCB;--rx:#E0674C;--rx-ink:#FFFFFF;--rx-soft:#FDE5DA;--seal:#C2452D;--hero:#FFE3D2;--sage-soft:#E3EFE6;
  --f-display:"Do Hyeon","Gowun Dodum",system-ui,sans-serif;--f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--f-hand:"Nanum Pen Script","Gowun Dodum",cursive;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.banner{display:flex;gap:12px;align-items:center;background:var(--sage-soft);border-radius:14px;padding:12px 16px}
.yak{width:44px;height:44px;border-radius:50%;background:var(--rx);color:var(--rx-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;flex:none}
.banner b{font-family:var(--f-display);font-weight:400;font-size:21px;display:block;line-height:1.25}
.muted{color:var(--muted)}
.rx{background:var(--card);border:1px solid var(--line);border-radius:6px;position:relative;padding:22px 18px 18px}
.rx:before{content:"";position:absolute;left:12px;right:12px;top:8px;border-top:2px dashed var(--line)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:6px}
.head h1{font-family:var(--f-display);font-weight:400;font-size:30px;letter-spacing:.5em;margin:0}
.label{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.no{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right}
.grid{display:grid;grid-template-columns:78px 1fr;border-top:2px solid var(--ink);margin-top:14px}
.grid>div{padding:10px 8px;border-bottom:1px solid var(--line);min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.k{font-size:13px;color:var(--muted);background:var(--rx-soft);display:flex;align-items:center}
.state{font-family:var(--f-display);font-size:22px;line-height:1.3}
.note{font-family:var(--f-hand);font-size:25px;line-height:1.35}
.verse{border-left:3px solid var(--rx);padding:2px 0 2px 12px}
.verse cite{font-style:normal;font-family:var(--f-display);color:var(--rx);display:block;margin-top:4px}
.dose{font-family:var(--f-mono);font-size:14px}
.foot{margin:14px 0 0;padding-right:86px;font-size:12px;color:var(--muted);min-height:64px}
.seal{position:absolute;right:14px;bottom:14px;width:74px;height:74px;border:2.5px solid var(--seal);color:var(--seal);border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:12px;line-height:1.15;transform:rotate(-12deg);opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.invite{background:var(--hero)}
.hand{font-family:var(--f-hand);font-size:26px;color:var(--rx);line-height:1}
.save img{width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin-top:10px;-webkit-touch-callout:default}
h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:22px}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="card"><h2>처방전을 여는 중이에요…</h2></div></main>
<script>
const DEFAULT_VERSES = [
  {id:"v01",ref:"마태복음 11:28",text:"수고하고 무거운 짐을 진 사람은 다 나에게로 오너라. 내가 너희를 쉬게 하겠다.",tags:"지침 바쁨 쉼 어린이"},
  {id:"v02",ref:"이사야 41:10",text:"내가 너와 함께 있으니, 두려워하지 말아라. 내가 너의 하나님이니, 떨지 말아라. 내가 너를 굳세게 하겠다. 내가 너를 도와주고, 내 승리의 오른팔로 너를 붙들어 주겠다.",tags:"불안 두려움"},
  {id:"v03",ref:"베드로전서 5:7",text:"여러분의 걱정을 모두 하나님께 맡기십시오. 하나님께서 여러분을 돌보고 계십니다.",tags:"불안 걱정 어린이"},
  {id:"v04",ref:"이사야 43:4 상",text:"내가 너를 보배롭게 여기고, 귀하게 여기고, 너를 사랑하므로",tags:"자존감 사랑 어린이"},
  {id:"v05",ref:"시편 23:1",text:"주님은 나의 목자시니, 내게 부족함이 없어라.",tags:"외로움 바쁨 어린이 어르신"},
  {id:"v06",ref:"시편 34:18",text:"주님은 마음 상한 사람에게 가까이 계시고, 낙심한 사람을 구원해 주신다.",tags:"슬픔 상실"},
  {id:"v07",ref:"요한복음 14:27",text:"나는 평화를 너희에게 남겨 준다. 나는 내 평화를 너희에게 준다. 내가 너희에게 주는 평화는 세상이 주는 평화와 같지 않다. 너희는 마음에 근심하지도 말고, 두려워하지도 말아라.",tags:"불안 평안"},
  {id:"v08",ref:"고린도후서 12:9 상",text:"그러나 주님께서는 나에게 \"내 은혜가 네게 족하다. 내 능력은 약한 데서 완전하게 된다\" 하고 말씀하셨습니다.",tags:"자존감 약함 은혜"},
  {id:"v09",ref:"마태복음 6:34",text:"그러므로 내일 일을 걱정하지 말아라. 내일 걱정은 내일이 맡아서 할 것이다. 한 날의 괴로움은 그 날로 족하다.",tags:"미래 걱정"},
  {id:"v10",ref:"예레미야 29:11",text:"너희를 두고 계획하고 있는 일들은 오직 나만이 알고 있다. 내가 너희를 두고 계획하고 있는 일은 재앙이 아니라 번영이다. 너희에게 미래와 희망을 주려는 것이다. 나 주의 말이다.",tags:"미래 진로"},
  {id:"v11",ref:"시편 46:1",text:"하나님은 우리의 피난처, 우리의 힘, 우리가 어려울 때에 곁에 있는 구원자.",tags:"힘듦 두려움"},
  {id:"v12",ref:"히브리서 13:5 하",text:"하나님께서는 \"내가 결코 너를 버리지 아니하고, 결코 너를 떠나지 아니하겠다\" 하고 말씀하셨습니다.",tags:"외로움"},
  {id:"v13",ref:"에베소서 4:32",text:"서로 친절히 대하며, 불쌍히 여기며, 서로 용서하기를 하나님께서 그리스도 안에서 여러분을 용서하신 것과 같이 하십시오.",tags:"관계 화 용서"},
  {id:"v14",ref:"로마서 12:15",text:"기뻐하는 사람들과 함께 기뻐하고, 우는 사람들과 함께 우십시오.",tags:"관계 슬픔 공동체"},
  {id:"v15",ref:"잠언 17:17",text:"사랑이 언제나 끊어지지 않는 것이 친구이고, 고난을 함께 나누도록 태어난 것이 형제이다.",tags:"친구 관계"},
  {id:"v16",ref:"갈라디아서 6:9",text:"선한 일을 하다가 낙심하지 맙시다. 지쳐서 넘어지지 아니하면, 때가 이를 때에 거두게 될 것입니다.",tags:"지침 낙심"},
  {id:"v17",ref:"데살로니가전서 5:16-18",text:"항상 기뻐하십시오. 끊임없이 기도하십시오. 모든 일에 감사하십시오. 이것이 그리스도 예수 안에서 여러분에게 바라시는 하나님의 뜻입니다.",tags:"감사 기쁨"},
  {id:"v18",ref:"시편 139:14",text:"내가 이렇게 빚어진 것이 오묘하고 주님께서 하신 일이 놀라워, 이 모든 일로 내가 주님께 감사를 드립니다. 내 영혼은 이 사실을 너무도 잘 압니다.",tags:"자존감"},
  {id:"v19",ref:"요한일서 4:10",text:"사랑은 이 사실에 있습니다. 우리가 하나님을 사랑한 것이 아니라, 하나님께서 우리를 사랑하셔서, 우리의 죄를 속하여 주시려고 그의 아들을 화목제물로 보내주신 것입니다.",tags:"복음 사랑"},
  {id:"v20",ref:"요한복음 3:16",text:"하나님이 세상을 이처럼 사랑하셔서 외아들을 주셨으니, 그를 믿는 사람마다 멸망하지 않고 영원한 생명을 얻게 하려는 것이다.",tags:"복음 사랑 처음"},
  {id:"v21",ref:"시편 121:1-2",text:"내가 눈을 들어 산을 본다. 내 도움이 어디에서 오는가? 내 도움은 하늘과 땅을 만드신 주님에게서 온다.",tags:"막막 미래"},
  {id:"v22",ref:"야고보서 1:19 하",text:"누구든지 듣기는 빨리 하고, 말하기는 더디 하고, 노하기도 더디 하십시오.",tags:"화 관계"},
  {id:"v24",ref:"예레미야애가 3:22-23",text:"주님의 한결같은 사랑이 다함이 없고 그 긍휼이 끝이 없기 때문이다. \"주님의 사랑과 긍휼이 아침마다 새롭고, 주님의 신실하심이 큽니다.\"",tags:"지침 새로움 어르신"},
  {id:"v25",ref:"시편 118:24",text:"이 날은 주님이 구별해 주신 날, 우리 모두 이 날에 기뻐하고 즐거워하자.",tags:"감사 기쁨"},
  {"id": "v26", "ref": "마태복음 11:29", "text": "나는 마음이 온유하고 겸손하니, 나의 멍에를 메고 나한테 배워라. 그리하면 너희는 마음에 쉼을 얻을 것이다.", "tags": "쉼 지침"},
  {"id": "v27", "ref": "이사야 40:31", "text": "오직 주님을 소망으로 삼는 사람은 새 힘을 얻으며, 독수리가 날개를 치며 솟아오르듯 올라갈 것이요, 뛰어도 지치지 않으며, 걸어도 피곤하지 않을 것이다.", "tags": "지침 소망 힘"},
  {"id": "v28", "ref": "이사야 40:29", "text": "피곤한 사람에게 힘을 주시며, 기운을 잃은 사람에게 기력을 주신다.", "tags": "지침 힘 어르신"},
  {"id": "v29", "ref": "시편 62:1", "text": "내 영혼이 잠잠히 하나님만 기다림은, 나의 구원이 그에게서만 오기 때문이다.", "tags": "쉼 기다림"},
  {"id": "v30", "ref": "시편 23:2-3", "text": "그가 나를 푸른 풀밭에 누이시며, 잔잔한 물가로 인도하신다. 나에게 다시 새 힘을 주시고, 당신의 이름을 위하여 나를 바른길로 인도하신다.", "tags": "쉼 지침 인도"},
  {"id": "v31", "ref": "마가복음 6:31 상", "text": "예수께서 그들에게 말씀하셨다. \"너희는 따로 외딴 곳으로 와서, 좀 쉬어라.\"", "tags": "쉼 바쁨"},
  {"id": "v32", "ref": "시편 46:10 상", "text": "너희는 잠깐 손을 멈추고, 내가 하나님인 줄 알아라.", "tags": "쉼 바쁨 불안"},
  {"id": "v33", "ref": "출애굽기 33:14", "text": "주님께서 대답하셨다. \"내가 친히 너와 함께 가겠다. 그리하여 네가 안전하게 하겠다.\"", "tags": "동행 쉼 미래"},
  {"id": "v34", "ref": "시편 4:8", "text": "내가 편히 눕거나 잠드는 것도, 주님께서 나를 평안히 쉬게 하여 주시기 때문입니다.", "tags": "잠 평안"},
  {"id": "v35", "ref": "시편 127:2 하", "text": "진실로 주님께서는, 사랑하시는 사람에게는 그가 잠을 자는 동안에도 복을 주신다.", "tags": "잠 바쁨"},
  {"id": "v36", "ref": "시편 121:3-4", "text": "주님께서는 네가 헛발을 디디지 않게 지켜 주신다. 너를 지키시느라 졸지도 않으신다. 이스라엘을 지키시는 분은 졸지도 않으시고, 잠들지도 않으신다.", "tags": "잠 보호 불안"},
  {"id": "v37", "ref": "잠언 3:24", "text": "네가 누울 때에 두려워하지 않고, 누우면 곧 단잠을 자게 될 것이다.", "tags": "잠 두려움"},
  {"id": "v38", "ref": "빌립보서 4:6-7", "text": "아무것도 염려하지 마십시오. 다만 모든 일에 기도와 간구로, 여러분의 요청을 감사하는 마음으로 하나님께 아뢰십시오. 그리하면 사람의 이해를 초월하는 하나님의 평화가 그리스도 예수 안에서 여러분의 마음과 생각을 지켜 줄 것입니다.", "tags": "불안 걱정 기도"},
  {"id": "v39", "ref": "시편 56:3", "text": "두려움이 온통 나를 휩싸는 날에도, 나는 오히려 주님을 의지합니다.", "tags": "두려움 불안"},
  {"id": "v40", "ref": "여호수아 1:9", "text": "내가 너에게 굳세고 용감하라고 명하지 않았느냐! 두려워하지 말며 놀라지 말아라. 네가 어디로 가든지, 주 너의 하나님이 너와 함께 있겠다.", "tags": "두려움 용기 미래 청소년"},
  {"id": "v41", "ref": "시편 27:1", "text": "주님이 나의 빛, 나의 구원이신데, 내가 누구를 두려워하랴? 주님이 내 생명의 피난처이신데, 내가 누구를 무서워하랴?", "tags": "두려움 불안"},
  {"id": "v42", "ref": "요한일서 4:18 상", "text": "사랑에는 두려움이 없습니다. 완전한 사랑은 두려움을 내쫓습니다.", "tags": "두려움 사랑"},
  {"id": "v43", "ref": "이사야 43:1 하", "text": "두려워하지 말아라. 내가 너를 속량하였고, 내가 너를 지명하여 불렀으니, 너는 나의 것이다.", "tags": "두려움 자존감"},
  {"id": "v44", "ref": "마태복음 6:26", "text": "공중의 새를 보아라. 씨를 뿌리지도 않고, 거두지도 않고, 곳간에 모아들이지도 않으나, 너희의 하늘 아버지께서 그것들을 먹이신다. 너희는 새보다 귀하지 아니하냐?", "tags": "걱정 미래 자존감 어린이"},
  {"id": "v45", "ref": "디모데후서 1:7", "text": "하나님께서 우리에게 주신 영은 비겁함의 영이 아니라, 능력과 사랑과 절제의 영입니다.", "tags": "두려움 용기 청소년"},
  {"id": "v47", "ref": "잠언 3:5-6", "text": "너는 마음을 다하여 주님을 신뢰하고, 너의 슬기에 의지하지 말아라. 너는 범사에 주님을 인정하여라. 그러면 주님께서 너의 길을 곧게 하실 것이다.", "tags": "미래 진로 신뢰"},
  {"id": "v48", "ref": "잠언 16:9", "text": "사람이 마음으로 자기의 앞길을 계획하지만, 그 발걸음을 인도하시는 분은 주님이시다.", "tags": "미래 진로"},
  {"id": "v49", "ref": "시편 119:105", "text": "주님의 말씀은 내 발의 등불이요, 내 길의 빛입니다.", "tags": "미래 막막 말씀"},
  {"id": "v50", "ref": "시편 37:5", "text": "너의 길을 주님께 맡기고, 주님만 의지하여라. 주님께서 이루어 주실 것이다.", "tags": "미래 진로 맡김"},
  {"id": "v51", "ref": "빌립보서 1:6", "text": "선한 일을 여러분 가운데서 시작하신 분께서 그리스도 예수의 날까지 그 일을 완성하실 것을 나는 확신합니다.", "tags": "미래 자존감 소망"},
  {"id": "v52", "ref": "이사야 43:19 상", "text": "내가 이제 새 일을 하려고 한다. 이 일이 이미 드러나고 있는데, 너희는 그것을 알지 못하느냐?", "tags": "미래 새로움"},
  {"id": "v53", "ref": "로마서 15:13", "text": "소망의 하나님께서 믿음에서 오는 모든 기쁨과 평화를 여러분에게 충만하게 주셔서, 성령의 능력으로 소망이 넘치게 하시기를 빕니다.", "tags": "소망 미래 기쁨"},
  {"id": "v54", "ref": "시편 32:8", "text": "내가 너의 갈 길을 가르쳐 보이고, 너를 눈여겨보며 너의 조언자가 되어 주겠다.", "tags": "미래 진로 인도"},
  {"id": "v55", "ref": "신명기 31:6", "text": "너희는 마음을 강하게 하고 담대하게 하여라. 그들 앞에서 두려워하지도 말고, 무서워하지도 말아라. 주 너희의 하나님이 친히 너희와 함께 가시면서, 너희를 떠나지도 않으시고, 버리지도 않으실 것이다.", "tags": "외로움 두려움 동행"},
  {"id": "v56", "ref": "마태복음 28:20 하", "text": "보아라, 내가 세상 끝날까지 항상 너희와 함께 있을 것이다.", "tags": "외로움 동행 어린이"},
  {"id": "v57", "ref": "시편 27:10", "text": "내 아버지와 내 어머니는 나를 버렸으나, 주님은 나를 돌보아 주십니다.", "tags": "외로움 어른"},
  {"id": "v59", "ref": "요한복음 15:13", "text": "친구를 위하여 자기 목숨을 내놓는 것보다 더 큰 사랑은 없다.", "tags": "친구 사랑 복음"},
  {"id": "v60", "ref": "이사야 49:15", "text": "어머니가 어찌 젖먹이를 잊겠으며, 자기 태에서 낳은 아들을 어찌 긍휼히 여기지 않겠느냐? 비록 어머니가 자식을 잊는다 하여도, 나는 절대로 너를 잊지 않겠다.", "tags": "외로움 사랑 어르신"},
  {"id": "v61", "ref": "이사야 49:16 상", "text": "보아라, 내가 네 이름을 내 손바닥에 새겼고", "tags": "외로움 자존감 어린이"},
  {"id": "v62", "ref": "로마서 8:38-39", "text": "나는 확신합니다. 죽음도, 삶도, 천사들도, 권세자들도, 현재 일도, 장래 일도, 능력도, 높음도, 깊음도, 그 밖에 어떤 피조물도, 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 우리를 끊을 수 없습니다.", "tags": "외로움 사랑 슬픔"},
  {"id": "v63", "ref": "에베소서 2:10", "text": "우리는 하나님의 작품입니다. 선한 일을 하게 하시려고, 하나님이 우리를 그리스도 예수 안에서 창조하셨습니다.", "tags": "자존감 청소년"},
  {"id": "v64", "ref": "시편 139:13", "text": "주님께서 내 장기를 창조하시고, 내 모태에서 나를 짜 맞추셨습니다.", "tags": "자존감"},
  {"id": "v65", "ref": "요한일서 3:1 상", "text": "보십시오, 아버지께서 우리에게 어떠한 사랑을 주셨는지를! 아버지께서 우리를 자녀라 일컬어 주셨으니, 우리는 과연 하나님의 자녀입니다.", "tags": "자존감 사랑"},
  {"id": "v66", "ref": "사무엘상 16:7 하", "text": "나는 사람들이 판단하는 것과는 다르게 판단한다. 사람은 겉모습을 보지만, 나 주는 중심을 본다.", "tags": "자존감 비교 청소년"},
  {"id": "v67", "ref": "스바냐 3:17", "text": "주 너의 하나님이 너와 함께 계신다. 구원을 베푸실 전능하신 하나님이시다. 너를 보고서 기뻐하고 반기시고, 너를 사랑으로 새롭게 하시고, 너를 보고서 기뻐하여 노래하실 것이다.", "tags": "자존감 사랑 기쁨"},
  {"id": "v68", "ref": "창세기 1:31 상", "text": "하나님이 손수 만드신 모든 것을 보시니, 보시기에 참 좋았다.", "tags": "자존감 어린이"},
  {"id": "v69", "ref": "고린도후서 5:17", "text": "그러므로 누구든지 그리스도 안에 있으면, 그는 새로운 피조물입니다. 옛것은 지나갔습니다. 보십시오, 새것이 되었습니다.", "tags": "새로움 복음 자존감"},
  {"id": "v70", "ref": "빌립보서 4:13", "text": "나에게 능력을 주시는 분 안에서, 나는 모든 것을 할 수 있습니다.", "tags": "자존감 용기 청소년"},
  {"id": "v71", "ref": "골로새서 3:13", "text": "누가 누구에게 불평할 일이 있더라도, 서로 용납하여 주고, 서로 용서하여 주십시오. 주님께서 여러분을 용서하신 것과 같이, 여러분도 그렇게 하십시오.", "tags": "관계 용서"},
  {"id": "v72", "ref": "고린도전서 13:4-5", "text": "사랑은 오래 참고, 사랑은 친절합니다. 사랑은 시기하지 않으며, 뽐내지 않으며, 교만하지 않습니다. 사랑은 무례하지 않으며, 자기의 이익을 구하지 않으며, 성을 내지 않으며, 원한을 품지 않습니다.", "tags": "관계 사랑 가족"},
  {"id": "v73", "ref": "로마서 12:18", "text": "여러분 쪽에서 할 수 있는 대로, 모든 사람과 더불어 평화롭게 지내십시오.", "tags": "관계 화"},
  {"id": "v74", "ref": "요한복음 13:34", "text": "이제 나는 너희에게 새 계명을 준다. 서로 사랑하여라. 내가 너희를 사랑한 것과 같이, 너희도 서로 사랑하여라.", "tags": "관계 사랑 공동체"},
  {"id": "v75", "ref": "전도서 4:9-10 상", "text": "두 사람이 한 사람보다 낫다. 두 사람이 함께 일할 때에, 더 나은 상을 받을 것이다. 한 사람이 넘어지면, 다른 한 사람이 자기의 친구를 일으켜 줄 것이다.", "tags": "친구 관계 외로움"},
  {"id": "v76", "ref": "갈라디아서 6:2", "text": "여러분은 서로 남의 짐을 져 주십시오. 그렇게 하면 그리스도의 법을 이루게 될 것입니다.", "tags": "관계 공동체 지침"},
  {"id": "v77", "ref": "마태복음 5:9", "text": "평화를 이루는 사람은 복이 있다. 하나님이 그들을 자기의 자녀라고 부르실 것이다.", "tags": "관계 화해"},
  {"id": "v78", "ref": "잠언 15:1", "text": "부드러운 대답은 분노를 가라앉히지만, 거친 말은 화를 돋운다.", "tags": "화 관계 말"},
  {"id": "v79", "ref": "에베소서 4:26", "text": "화를 내더라도, 죄를 짓는 데까지는 이르지 않도록 하십시오. 해가 지도록 노여움을 품고 있지 마십시오.", "tags": "화"},
  {"id": "v80", "ref": "잠언 16:32", "text": "노하기를 더디 하는 사람은 용사보다 낫고, 자기의 마음을 다스리는 사람은 성을 점령한 사람보다 낫다.", "tags": "화 청소년"},
  {"id": "v81", "ref": "시편 37:8", "text": "노여움을 버려라. 격분을 가라앉혀라. 불평하지 말아라. 오히려 악으로 기울어질 뿐이다.", "tags": "화 억울"},
  {"id": "v82", "ref": "마태복음 5:4", "text": "슬퍼하는 사람은 복이 있다. 하나님이 그들을 위로하실 것이다.", "tags": "슬픔 위로"},
  {"id": "v83", "ref": "시편 147:3", "text": "마음이 상한 사람들을 치료하시고, 그 아픈 곳을 싸매어 주신다.", "tags": "슬픔 상처 관계"},
  {"id": "v84", "ref": "요한계시록 21:4", "text": "하나님께서 그들의 눈에서 모든 눈물을 닦아 주실 것이니, 다시는 죽음이 없고, 슬픔도 울부짖음도 고통도 없을 것이다. 이전 것들이 다 사라져 버렸기 때문이다.", "tags": "슬픔 상실 소망"},
  {"id": "v85", "ref": "고린도후서 1:4 상", "text": "하나님은 온갖 환난 가운데서 우리를 위로하여 주십니다.", "tags": "슬픔 위로 힘듦"},
  {"id": "v86", "ref": "시편 30:5 하", "text": "밤새도록 눈물을 흘려도, 새벽이 오면 기쁨이 넘친다.", "tags": "슬픔 소망"},
  {"id": "v87", "ref": "요한복음 11:35", "text": "예수께서 눈물을 흘리셨다.", "tags": "슬픔 상실 공감"},
  {"id": "v88", "ref": "이사야 41:13", "text": "나 주 너의 하나님이 너의 오른손을 붙잡고 있다. 내가 너에게 말한다. '두려워하지 말아라. 내가 너를 돕겠다.'", "tags": "두려움 불안 어린이"},
  {"id": "v89", "ref": "시편 136:1", "text": "주님께 감사하여라. 그는 선하시다. 그의 인자하심은 영원하다.", "tags": "감사 어르신"},
  {"id": "v90", "ref": "시편 103:2", "text": "내 영혼아, 주님을 송축하여라. 주님께서 베풀어 주신 모든 은혜를 잊지 말아라.", "tags": "감사 어르신"},
  {"id": "v91", "ref": "빌립보서 4:4", "text": "주님 안에서 항상 기뻐하십시오. 다시 말합니다. 기뻐하십시오.", "tags": "기쁨 감사"},
  {"id": "v92", "ref": "골로새서 3:15", "text": "그리스도의 평화가 여러분의 마음을 다스리게 하십시오. 이 평화를 누리도록 여러분은 부르심을 받아 한 몸이 되었습니다. 또한 여러분은 감사하는 사람이 되십시오.", "tags": "감사 평안 공동체"},
  {"id": "v93", "ref": "야고보서 1:17 상", "text": "온갖 좋은 은사와 완전한 선물은 위에서, 곧 빛들을 지으신 아버지께로부터 내려옵니다.", "tags": "감사 기쁨"},
  {"id": "v94", "ref": "시편 16:11", "text": "주님께서 몸소 생명의 길을 나에게 보여 주시니, 주님을 모시고 사는 삶에 기쁨이 넘칩니다. 주님께서 내 오른쪽에 계시니, 나에게는 영원한 즐거움이 있습니다.", "tags": "기쁨 미래"},
  {"id": "v95", "ref": "로마서 5:8", "text": "그러나 우리가 아직 죄인이었을 때에, 그리스도께서 우리를 위하여 죽으심으로써, 하나님께서는 우리에 대한 자기의 사랑을 실증하셨습니다.", "tags": "복음 사랑"},
  {"id": "v96", "ref": "요한복음 10:10 하", "text": "나는, 양들이 생명을 얻고 또 더 넘치게 얻게 하려고 왔다.", "tags": "복음 처음 소망"},
  {"id": "v97", "ref": "에베소서 2:8", "text": "여러분은 믿음을 통하여 은혜로 구원을 얻었습니다. 이것은 여러분에게서 나온 것이 아니라, 하나님의 선물입니다.", "tags": "복음 은혜"},
  {"id": "v98", "ref": "요한계시록 3:20", "text": "보아라, 내가 문 밖에 서서 문을 두드리고 있다. 누구든지 내 음성을 듣고 문을 열면, 나는 그에게로 들어가서 그와 함께 먹고, 그는 나와 함께 먹을 것이다.", "tags": "복음 처음 초대"},
  {"id": "v99", "ref": "누가복음 15:20 하", "text": "아직도 먼 거리에 있는데, 그의 아버지가 그를 보고 측은히 여겨서, 달려가서 그의 목을 껴안고 입을 맞추었다.", "tags": "복음 처음 돌아옴 가족"},
  {"id": "v100", "ref": "요한복음 8:12 상", "text": "나는 세상의 빛이다. 나를 따르는 사람은 어둠 속에서 걷지 않고, 생명의 빛을 얻을 것이다.", "tags": "복음 막막 처음"},
  {"id": "v101", "ref": "예레미야 31:3 하", "text": "내가 너를 영원한 사랑으로 사랑하였기에, 너에게 한결같은 사랑을 베푼다.", "tags": "사랑 외로움 자존감"},
  {"id": "v102", "ref": "요한일서 4:19", "text": "우리가 사랑하는 것은 하나님께서 먼저 우리를 사랑하셨기 때문입니다.", "tags": "사랑 어린이 처음"},
  {"id": "v103", "ref": "시편 18:1", "text": "나의 힘이신 주님, 내가 주님을 사랑합니다.", "tags": "사랑 어린이 감사"},
  {"id": "v104", "ref": "마태복음 19:14", "text": "예수께서 말씀하셨다. \"어린이들을 그냥 두어라. 그들이 내게 오는 것을 막지 말아라. 하늘 나라는 이런 사람들의 것이다.\"", "tags": "어린이 처음 환영"},
  {"id": "v105", "ref": "요한일서 4:8 하", "text": "하나님은 사랑이십니다.", "tags": "사랑 어린이 처음"},
  {"id": "v106", "ref": "시편 118:6 상", "text": "주님은 내 편이시므로, 나는 두려워하지 않는다.", "tags": "두려움 어린이 청소년"},
  {"id": "v107", "ref": "잠언 17:22", "text": "즐거운 마음은 병을 낫게 하지만, 근심하는 마음은 뼈를 마르게 한다.", "tags": "기쁨 걱정 마음약국"},
  {"id": "v108", "ref": "이사야 46:4", "text": "너희가 늙을 때까지 내가 너희를 안고 다니고, 너희가 백발이 될 때까지 내가 너희를 품고 다니겠다. 내가 지었으니, 내가 품고 다니겠고, 안고 다니고, 또 구원하여 주겠다.", "tags": "어르신 동행 외로움"},
  {"id": "v109", "ref": "시편 92:14", "text": "늙어서도 여전히 열매를 맺으며, 진액이 넘치고, 항상 푸르를 것이다.", "tags": "어르신 감사 자존감"},
  {"id": "v110", "ref": "시편 71:9", "text": "내가 늙더라도 나를 내치지 마시고, 내가 쇠약하더라도 나를 버리지 마십시오.", "tags": "어르신 외로움 기도"},
];;
const DEFAULT_SETTINGS={festival:"다다다 페스티벌",booth:"마음약국",church:"부천오정교회",bible:"새번역"};
const pad=(n)=>String(n).padStart(3,"0");
const rxNo=(st,n)=>`다다-${pad(n)}`;
function bytesFromB64url(t){ const b=atob(t.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((t.length+3)%4)); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u }
function decodeRx(token){
  const a=JSON.parse(new TextDecoder().decode(bytesFromB64url(token.replace(/^#?rx\./,""))));
  if(!Array.isArray(a)||a[0]!==1) throw new Error("bad");
  const v=typeof a[5]==="string"?(DEFAULT_VERSES.find(x=>x.id===a[5])||{ref:"",text:""}):{ref:a[5][0],text:a[5][1]};
  const m=Array.isArray(a[14])?a[14]:[0,0,0,0];
  const st={...DEFAULT_SETTINGS}; ["booth","festival","church","bible"].forEach((k,i)=>{ if(m[i]) st[k]=m[i] });
  return {rx:{name:a[1],ageLabel:a[2],state_name:a[3],message:a[4],verse:v,verse_note:a[6],practice:a[7],dosage:a[8],prayer:a[9],
    med:{name:a[10],color:a[11]},noLabel:a[12],time:a[13]},settings:st,invite:a[15]||""};
}
const PRINT_SIZES = {
  r58:{label:"영수증 58mm",w:384,min:0,pad:14},
  r80:{label:"영수증 80mm",w:576,min:0,pad:20},
  a6:{label:"A6 카드 (105×148mm)",w:1240,min:1748,pad:90},
};
function wrapLines(ctx,text,maxW){
  const out=[]; String(text||"").split("\n").forEach(par=>{
    let line=""; par.split(" ").forEach(word=>{
      const t=line?line+" "+word:word;
      if(ctx.measureText(t).width<=maxW){ line=t; return }
      if(line) out.push(line);
      if(ctx.measureText(word).width<=maxW){ line=word; return }
      let chunk=""; for(const ch of word){ if(ctx.measureText(chunk+ch).width>maxW){ out.push(chunk); chunk=ch } else chunk+=ch }
      line=chunk;
    }); out.push(line);
  }); return out;
}
async function renderRx(rx,settings,sizeKey){
  const S=PRINT_SIZES[sizeKey]||PRINT_SIZES.r80, W=S.w, P=S.pad, u=W/24;
  try{ await Promise.all([document.fonts.load(`${u}px "Gowun Dodum"`),document.fonts.load(`${u}px "Do Hyeon"`),document.fonts.load(`${u}px "Nanum Pen Script"`)]) }catch(e){}
  const c=document.createElement("canvas"); c.width=W; c.height=Math.max(S.min,W*6); const x=c.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.fillStyle="#000"; x.strokeStyle="#000"; x.textBaseline="top";
  const F={disp:'"Do Hyeon","Gowun Dodum",sans-serif',body:'"Gowun Dodum","Malgun Gothic",sans-serif',hand:'"Nanum Pen Script","Gowun Dodum",cursive',mono:'"IBM Plex Mono",monospace'};
  let y=P; const inner=W-P*2;
  const text=(t,size,font,opt={})=>{ x.font=`${size}px ${font}`; x.textAlign=opt.align||"left";
    const lines=wrapLines(x,t,opt.w||inner); const lh=size*(opt.lh||1.45); const ox=opt.align==="center"?W/2:(opt.x||P);
    lines.forEach(l=>{ x.fillText(l,ox,y); y+=lh }); x.textAlign="left"; };
  const rule=(dash)=>{ x.save(); x.lineWidth=Math.max(1,u/12); if(dash) x.setLineDash([u/3,u/4]); x.beginPath(); x.moveTo(P,y); x.lineTo(W-P,y); x.stroke(); x.restore(); y+=u*.7 };
  const label=(t)=>{ text(t,u*.72,F.body,{lh:1.6}) };
  text(`${settings.church} · ${settings.festival}`,u*.75,F.body,{align:"center"});
  text(settings.booth,u*1.25,F.disp,{align:"center",lh:1.2});
  y+=u*.2; text("처  방  전",u*1.9,F.disp,{align:"center",lh:1.25});
  text(`No. ${(rx.noLabel||rxNo(settings,rx.no))}   ${rx.time}`,u*.7,F.mono,{align:"center"});
  y+=u*.3; rule(false);
  label("받는 분"); text(`${rx.name||"이름 없는 손님"} · ${rx.ageLabel}`,u,F.body); y+=u*.3;
  label("마음 상태"); text(rx.state_name,u*1.25,F.disp,{lh:1.3}); y+=u*.3;
  label("약사 소견"); text(rx.message,u*1.3,F.hand,{lh:1.25}); y+=u*.3; rule(true);
  label(`말씀 처방 · ${settings.bible}`);
  const vy=y; x.save(); text(rx.verse?.text,u,F.body,{x:P+u*.7,w:inner-u*.7}); x.restore();
  x.fillRect(P,vy,Math.max(2,u/6),y-vy-u*.3);
  text(rx.verse?.ref,u*.95,F.disp,{x:P+u*.7}); if(rx.verse_note){ y+=u*.15; text(rx.verse_note,u*.85,F.body) } y+=u*.3; rule(true);
  label("복용법"); text(rx.dosage,u*.8,F.mono); text(rx.practice,u*.95,F.body); y+=u*.3;
  label("한 줄 기도"); text(rx.prayer,u*.95,F.body); y+=u*.3;
  label("조제 약"); text(rx.med?.name||"",u*1.15,F.disp); y+=u*.2; rule(false);
  // 도장
  const r=u*2.1, cx=W-P-r, cy=y+r; x.save(); x.lineWidth=Math.max(2,u/8); x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.stroke();
  x.font=`${u*.62}px ${F.disp}`; x.textAlign="center"; x.fillText(settings.booth,cx,cy-u*.75); x.fillText("약사 확인",cx,cy+u*.05); x.restore();
  const keep=y; text("이 처방전은 마음을 돌보는 작은 선물이에요.",u*.65,F.body,{w:inner-r*2-u}); text("실제 진료나 상담을 대신하지 않아요.",u*.65,F.body,{w:inner-r*2-u});
  y=Math.max(y,keep+r*2)+P;
  const H=Math.max(S.min,Math.ceil(y)); const o=document.createElement("canvas"); o.width=W; o.height=H;
  const ox=o.getContext("2d"); ox.fillStyle="#fff"; ox.fillRect(0,0,W,H); ox.drawImage(c,0,0,W,Math.min(H,c.height),0,0,W,Math.min(H,c.height));
  return await new Promise(res=>o.toBlob(res,"image/png"));
}


const esc=(t)=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  let d; try{ d=decodeRx(h) }catch(e){ app.innerHTML='<div class="card"><h2>처방전을 열지 못했어요</h2><p class="muted" style="margin:6px 0 0">QR을 다시 찍어 주시거나, 부스 선생님께 말씀해 주세요.</p></div>'; return }

  <article class="rx">

      <div class="no">No. ${esc(rx.noLabel)}<br>${esc(rx.time)}</div></div>

      <div class="k">약사 소견</div><div class="note">${esc(rx.message)}</div>

    </div>
    <p class="foot">이 처방전은 마음을 돌보는 작은 선물이에요. 실제 진료나 상담을 대신하지 않아요.</p>
    <div class="seal">${esc(st.booth)}<br>약사<br>확인</div>
  </article>
  ${invite?`<div class="card invite"><div class="hand">또 만나요!</div><p style="margin:6px 0 0">${esc(invite)}</p></div>`:""}
  <div class="card save"><h2>사진으로 저장하기</h2><p class="muted" style="margin:4px 0 0">아래 그림을 길게 누르고 '사진에 저장'(안드로이드는 '이미지 저장')을 눌러 주세요.</p><div id="img" class="muted" style="margin-top:8px">그림을 만드는 중…</div></div>`;
  try{
    const blob=await renderRx({...rx,noLabel:rx.noLabel},st,"phone");
    const url=URL.createObjectURL(blob);
    document.getElementById("img").outerHTML=`<img src="${url}" alt="마음 처방전 사진">`;
  }catch(e){ document.getElementById("img").textContent="그림을 만들지 못했어요. 화면을 캡처해 주세요." }
}
show(); window.addEventListener("hashchange",show);
